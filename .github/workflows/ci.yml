name: Validate game

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a main deployment; newer main pushes replace only queued runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # Full serial regression reached 19m21s before the new v10 consumer suites.
    # Keep every assertion and test timeout; allow runner-speed variance at job level.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.9.0 --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Validate boundaries, content, tests and build
        run: npm run check
      - name: Build the Pages preview from the validated commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VITE_BASE_PATH: /shanmen-changming/
          VITE_ENABLE_V8_CANDIDATE: '1'
          VITE_ENABLE_V9_MANAGEMENT: '1'
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/candidate.html
          test -f dist/management.html
          # These optional originals remain local, outside Git and the Pages artifact.
          test ! -e dist/assets/portraits/disciples-atlas-v1.png
          test ! -e dist/assets/campaign/jade-mountain-route-v1.png
          printf '{"commit":"%s","runId":"%s","runAttempt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > dist/build-info.json
      - name: Upload the validated Pages preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Read the current main SHA; no source checkout or execution here.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Check the existing Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # One-time repository setup is documented in docs/pages-deployment.md.
          enablement: false
      - name: Reject deployment of an outdated main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::error::main has moved to $main_sha. Only its successful validation may deploy; this run is $GITHUB_SHA."
            exit 1
          fi
      - name: Deploy this run's validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
